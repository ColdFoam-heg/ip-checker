name: Build Injected Demo IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Demo/**"
      - "Sources/**"
      - ".github/workflows/build-demo.yml"

jobs:
  build-demo:
    runs-on: macos-15
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 选择最新 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3. 编译 App（未签名，流程同正式版）
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild clean build \
            -project IPChecker.xcodeproj \
            -scheme IPChecker \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 4. 编译教学 dylib（LengMoDemo）
        run: |
          xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc -dynamiclib \
            -o LengMoDemo.dylib Demo/LengMoDemo.m \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework CoreFoundation
          xcrun dsymutil LengMoDemo.dylib -o LengMoDemo.dylib.dSYM
          file LengMoDemo.dylib

      - name: 5. 注入：dylib 放进 .app + LIEF 给主程序加加载命令
        run: |
          pip3 install --quiet --break-system-packages lief
          APP=build/Build/Products/Release-iphoneos/IPChecker.app
          mkdir -p "$APP/Frameworks"
          cp LengMoDemo.dylib "$APP/Frameworks/"
          python3 - << 'PYEOF'
          import lief
          exe_path = "build/Build/Products/Release-iphoneos/IPChecker.app/IPChecker"
          fat = lief.MachO.parse(exe_path)
          binary = fat.at(0)
          binary.add_library("@executable_path/Frameworks/LengMoDemo.dylib")
          binary.write(exe_path)
          print("=== 注入后包含 LengMoDemo 的加载命令 ===")
          for cmd in binary.commands:
              if "LengMoDemo" in str(cmd):
                  print(cmd)
          PYEOF

      - name: 6. 打包演示 IPA
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/IPChecker.app Payload/
          zip -r IPChecker_Demo_Injected.ipa Payload
          echo "=== IPA 内容核查 ==="
          unzip -l IPChecker_Demo_Injected.ipa | grep -E "LengMoDemo|IPChecker.app/IPChecker$"

      - name: 7. 上传成品（演示 IPA + dylib + dSYM 符号）
        uses: actions/upload-artifact@v4
        with:
          name: IPChecker-Demo-Injected
          path: |
            IPChecker_Demo_Injected.ipa
            LengMoDemo.dylib
            LengMoDemo.dylib.dSYM
