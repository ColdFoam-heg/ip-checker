name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 1.5 选择最新 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 2. 生成 Xcode 工程 (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 3. 编译无签名 App
        run: |
          xcodebuild clean build \
            -project IPChecker.xcodeproj \
            -scheme IPChecker \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 4. 打包成 .ipa 安装包
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/IPChecker.app Payload/
          zip -r IPChecker_Unsigned.ipa Payload

      - name: 5. 上传 .ipa 成品供下载
        uses: actions/upload-artifact@v4
        with:
          name: IPChecker-IPA
          path: IPChecker_Unsigned.ipa
