name: IPChecker
options:
  bundleIdPrefix: com.lengmo
  deploymentTarget:
    iOS: "15.0"
targets:
  IPChecker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.0"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "IP体检"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 LengMo"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSExceptionDomains:
            ip-api.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
